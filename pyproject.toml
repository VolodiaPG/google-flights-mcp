[project]
name = "cheapest-flights"
version = "0.1.0"
description = "CLI to find the cheapest flights between two airports over a date window (Google Flights via fast-flights)"
requires-python = ">=3.10"
dependencies = [
    "fast-flights>=3.1.0",
    "primp",
    "mcp>=2",
    "typing_extensions",  # imported by fast-flights but not declared by it
]

[project.scripts]
cheapest-flights = "cheapest_flights:main"
cheapest-flights-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["cheapest_flights.py", "mcp_server.py"]

[dependency-groups]
dev = ["pytest"]
